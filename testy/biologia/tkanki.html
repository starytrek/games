<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tkanki zwierzęce — 2 LO</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#101827;color:#edf6ff;font:16px/1.5 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px 16px 60px}h1{font-size:2.4rem;margin:0}p{color:#bacce0}.bar{position:sticky;top:0;background:#101827ef;backdrop-filter:blur(9px);border-bottom:1px solid #456;padding:12px 0;display:flex;gap:14px;align-items:center;z-index:2}.meter{height:9px;background:#345;flex:1;border-radius:8px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#75e3b6;transition:.2s}.card{background:#1b2a40;border:1px solid #435872;border-radius:16px;padding:22px;margin:17px 0;scroll-margin-top:80px}.tag{font-size:.8rem;color:#82e4bd;font-weight:800;letter-spacing:.06em}h2{font-size:1.13rem;line-height:1.4}.answers{display:grid;gap:9px}button{font:inherit;cursor:pointer}.opt{background:#253b58;color:#eef7ff;border:1px solid #546b89;border-radius:11px;padding:13px;text-align:left}.opt:hover:not(:disabled){background:#355477}.opt:disabled{cursor:default}.opt.good{border-color:#69dbae;background:#1b513e}.opt.bad{border-color:#ff9595;background:#5b323c}.exp{background:#304761;padding:13px;border-radius:10px;margin-top:13px}.hidden{display:none}.action{background:#75dfb2;border:0;border-radius:10px;padding:12px 18px;font-weight:800;color:#123020}.action:disabled{opacity:.45}.result{border:1px solid #75dfb2;background:#1c3e37;border-radius:16px;padding:22px;margin-top:24px;scroll-margin-top:80px}.miss{border-top:1px solid #507565;padding:12px 0}button:focus-visible{outline:3px solid #ffe083;outline-offset:2px}
</style><main><nav style="margin:0 0 20px"><a href="../../index.html" style="display:inline-block;background:#fff;color:#163bb9;padding:10px 16px;border-radius:9px;font:600 16px system-ui;text-decoration:none">Wróć do materiałów</a></nav><div class="tag">BIOLOGIA • 2 LO • TRYB ŚREDNIO ZAAWANSOWANY</div><h1>Tkanki zwierzęce</h1><p>10 nowych pytań ABCD na jednej stronie. Po kliknięciu odpowiedzi od razu zobaczysz wyjaśnienie. Na końcu otrzymasz wynik i powtórkę błędów.</p><div class="bar"><span id="progress">0/10</span><span class="meter"><i id="fill"></i></span><span id="score">0 pkt</span></div><div id="list"></div><section id="final" class="result"><h2>Podsumowanie</h2><p id="hint">Odpowiedz na wszystkie pytania.</p><button class="action" id="show" disabled>Pokaż wynik</button><div id="summary" class="hidden"></div></section></main>
<script>
const Q=[
["Nabłonkowa","W próbce jelita widać pojedynczą warstwę wysokich komórek z mikrokosmkami i komórkami kubkowymi. Które połączenie funkcji jest najbardziej trafne?",["Mikrokosmki przesuwają śluz, a komórki kubkowe wchłaniają tłuszcze","Mikrokosmki zwiększają powierzchnię wchłaniania, a komórki kubkowe wydzielają śluz","Obie struktury służą głównie do przewodzenia impulsów","Komórki kubkowe wzmacniają kość, a mikrokosmki przesuwają śluz"],1,"Mikrokosmki zwiększają powierzchnię wchłaniania. Komórki kubkowe wydzielają śluz chroniący i nawilżający powierzchnię."],
["Nabłonkowa","W uszkodzeniu nabłonka zniszczona zostaje błona podstawna. Jaki skutek jest najbardziej bezpośredni?",["Komórki nabłonka tracą ważne podłoże mocujące je do tkanki leżącej niżej","Erytrocyty przestają wytwarzać hemoglobinę","Mięśnie przestają zawierać aktynę","Chrząstka natychmiast kostnieje"],0,"Błona podstawna oddziela i mocuje nabłonek do tkanki łącznej pod nim; jest też ważna dla organizacji i odnowy nabłonka."],
["Nabłonkowa","Gruczoł A oddaje wydzielinę przewodem na powierzchnię skóry. Gruczoł B uwalnia hormon do płynu tkankowego, skąd trafia do krwi. Jak je sklasyfikować?",["A wewnątrzwydzielniczy, B zewnątrzwydzielniczy","Oba wewnątrzwydzielnicze","A zewnątrzwydzielniczy, B wewnątrzwydzielniczy","Oba są tkanką mięśniową"],2,"Gruczoł zewnątrzwydzielniczy ma przewód wyprowadzający. Wewnątrzwydzielniczy nie ma takiego przewodu; hormony trafiają do krwi po uwolnieniu do otoczenia komórek."],
["Łączna","Ścięgno musi wytrzymywać silne rozciąganie głównie w jednym kierunku. Która cecha budowy najlepiej temu odpowiada?",["Równolegle ułożone pęczki włókien kolagenowych","Duże jamki z chondrocytami i brak włókien","Jedna warstwa komórek nabłonka płaskiego","Liczne aksony z osłonką mielinową"],0,"Ścięgno jest przykładem tkanki łącznej zbitej o regularnym układzie włókien kolagenowych, odpornym na rozciąganie wzdłuż ich przebiegu."],
["Łączna","Porównujesz chrząstkę i kość. Które zdanie prawidłowo tłumaczy różnicę w ich gojeniu?",["Chrząstka jest lepiej ukrwiona niż kość","Kość ma naczynia krwionośne, a chrząstka nie jest bezpośrednio unaczyniona","Obie tkanki nie zawierają żywych komórek","Kość nie ma substancji międzykomórkowej"],1,"Kość jest unaczyniona. Chrząstka otrzymuje substancje odżywcze drogą dyfuzji, co ogranicza tempo jej regeneracji."],
["Łączna","Po urazie stawu uszkodzona zostaje powierzchnia, która zmniejsza tarcie między końcami kości. Która tkanka uległa uszkodzeniu?",["Tkanka chrzęstna szklista","Tkanka nabłonkowa wielowarstwowa","Tkanka mięśniowa gładka","Tkanka nerwowa"],0,"Powierzchnie stawowe pokrywa chrząstka szklista; wraz z mazią pomaga ograniczać tarcie i amortyzować nacisk."],
["Mięśniowa","Preparat wykazuje poprzeczne prążkowanie, pojedyncze centralnie położone jądra i połączenia zwane wstawkami. Co to za tkanka?",["Mięśniowa szkieletowa","Mięśniowa gładka","Mięśniowa serca","Nabłonkowa jednowarstwowa"],2,"Komórki mięśnia sercowego są prążkowane, zwykle mają centralne jądro i łączą się wstawkami."],
["Mięśniowa","Dlaczego ściana jelita może wykonywać ruchy przesuwające treść bez świadomego sterowania?",["Zawiera mięśnie szkieletowe kierowane wolą","Zawiera tkankę mięśniową gładką, której skurcze są niezależne od woli","Tworzą ją wyłącznie chrząstki","Rzęski erytrocytów przesuwają treść"],1,"W ścianie jelita mięśnie gładkie wykonują ruchy perystaltyczne niezależnie od świadomej decyzji."],
["Nerwowa","Uszkodzona została osłonka mielinowa aksonu, lecz ciało neuronu pozostało całe. Czego należy się spodziewać przede wszystkim?",["Szybszego przewodzenia impulsów","Zaburzenia sprawnego przewodzenia impulsów wzdłuż aksonu","Zwiększenia liczby erytrocytów","Zamiany aksonu w dendryt"],1,"Osłonka mielinowa umożliwia szybkie przewodzenie skokowe; jej uszkodzenie może spowolnić lub zaburzyć przekazywanie impulsów."],
["Nerwowa","Sygnał dotarł do zakończenia aksonu. Jak najczęściej przejdzie przez synapsę chemiczną do kolejnej komórki?",["Przez bezpośredni przepływ hemoglobiny","Dzięki uwolnieniu neuroprzekaźnika i związaniu go z receptorami komórki odbierającej","Dzięki ruchom rzęsek nabłonkowych","Przez krzepnięcie osocza"],1,"W synapsie chemicznej zakończenie neuronu uwalnia neuroprzekaźnik, który oddziałuje z receptorami następnej komórki."]
];
let answers=Array(Q.length).fill(null),score=0;
const el=id=>document.getElementById(id);
function update(){const n=answers.filter(v=>v!==null).length;el("progress").textContent=n+"/"+Q.length;el("score").textContent=score+" pkt";el("fill").style.width=100*n/Q.length+"%";el("show").disabled=n!==Q.length;el("hint").textContent=n===Q.length?"Gotowe. Kliknij, aby zobaczyć podsumowanie.":"Pozostało "+(Q.length-n)+" pytań."}
function render(){el("list").replaceChildren();Q.forEach((q,i)=>{let card=document.createElement("section");card.className="card";let tag=document.createElement("div");tag.className="tag";tag.textContent="PYTANIE "+(i+1)+" / "+Q.length+" · TKANKA "+q[0].toUpperCase();let title=document.createElement("h2");title.textContent=q[1];let opts=document.createElement("div");opts.className="answers";let exp=document.createElement("div");exp.className="exp hidden";exp.setAttribute("aria-live","polite");q[2].forEach((v,j)=>{let b=document.createElement("button");b.type="button";b.className="opt";b.textContent="ABCD"[j]+". "+v;b.onclick=()=>{if(answers[i]!==null)return;answers[i]=j;if(j===q[3])score++;[...opts.children].forEach((o,k)=>{o.disabled=true;if(k===q[3])o.classList.add("good");else if(k===j)o.classList.add("bad")});exp.classList.remove("hidden");exp.textContent=(j===q[3]?"Dobrze. ":"Niepoprawnie. Poprawna odpowiedź: "+"ABCD"[q[3]]+". ")+q[4];update()};opts.append(b)});card.append(tag,title,opts,exp);el("list").append(card)});update()}
el("show").onclick=()=>{const box=el("summary");box.replaceChildren();box.classList.remove("hidden");el("show").classList.add("hidden");el("hint").classList.add("hidden");let h=document.createElement("h2");h.textContent="Wynik: "+score+" / "+Q.length+" ("+Math.round(score/Q.length*100)+"%)";box.append(h);let note=document.createElement("p");note.textContent=score>=9?"Bardzo dobrze!":score>=7?"Dobry wynik. Powtórz błędy poniżej.":score>=5?"Powtórz budowę i funkcje poszczególnych tkanek.":"Warto jeszcze raz przejrzeć cztery rodzaje tkanek i rozwiązać test ponownie.";box.append(note);let wrong=Q.map((q,i)=>({q,i})).filter(v=>answers[v.i]!==v.q[3]);if(wrong.length){let t=document.createElement("h3");t.textContent="Do powtórki";box.append(t);wrong.forEach(({q,i})=>{let d=document.createElement("div");d.className="miss";d.textContent=(i+1)+". "+q[1]+" — poprawnie: "+"ABCD"[q[3]]+". "+q[4];box.append(d)})}let t=document.createElement("h3");t.textContent="Wynik według tkanki";box.append(t);["Nabłonkowa","Łączna","Mięśniowa","Nerwowa"].forEach(name=>{let ids=Q.map((q,i)=>i).filter(i=>Q[i][0]===name);let n=ids.filter(i=>answers[i]===Q[i][3]).length;let p=document.createElement("div");p.className="miss";p.textContent=name+": "+n+"/"+ids.length;box.append(p)});let b=document.createElement("button");b.className="action";b.textContent="Rozwiąż ponownie";b.onclick=()=>{answers=Array(Q.length).fill(null);score=0;box.classList.add("hidden");el("show").classList.remove("hidden");el("hint").classList.remove("hidden");render();scrollTo({top:0,behavior:"smooth"})};box.append(b);box.scrollIntoView({behavior:"smooth",block:"start"})};
render();
</script></html>
