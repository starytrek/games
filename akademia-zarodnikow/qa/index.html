<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test układu Akademii Zarodników</title><style>body{font:16px system-ui;background:#e9e4dc;color:#352d42;margin:16px}button,select{font:inherit;padding:8px;margin:4px;border:1px solid #c2b9ab;border-radius:8px;background:#fff8eb}iframe{display:block;border:1px solid #9a9186;border-radius:16px;margin:14px auto;box-shadow:0 8px 25px #352d4220}p{font-size:14px}#status{color:#346957}</style><h1 style="font-size:22px">Podgląd testowy — osobny zapis QA</h1><p>To środowisko testowe; nie zmienia postępów graczy. Mały ekran jest renderowany wewnątrz ramki, bez emulacji sprzętu.</p><label>Rozmiar <select id="size"><option value="360,740">360 × 740</option><option value="320,640">320 × 640</option><option value="390,844">390 × 844</option><option value="430,780">430 × 780</option><option value="1080,720">1080 × 720</option></select></label><label>Kraina <select id="world"><option value="0">Grzybowy las</option><option value="1">Miasto komórek</option><option value="2" selected>Zielona energia</option><option value="3">Kropla mikroświata</option><option value="4">Podziemna sieć</option><option value="5">Dolina paproci</option></select></label><button id="fresh">Nowa misja — odblokowane krainy</button><button id="old">Stary zapis: 300 pkt i 1 misja</button><button id="reload">Odśwież grę</button><p id="status"></p><iframe id="game" title="Gra — test małego ekranu" src="../?qa=1"></iframe><script>
const frame=document.getElementById('game'),key='naukogramy.myko.v1.qa';function size(){const[w,h]=document.getElementById('size').value.split(',');frame.width=w;frame.height=h}size();document.getElementById('size').onchange=size;function seed(old){const world=+document.getElementById('world').value;let complete=old?['0:0']:Array.from({length:world*3},(_,i)=>Math.floor(i/3)+':'+i%3);const facts=old?Object.fromEntries([0,1,2].map(i=>['myko-0-'+i,{best:100,tries:1,wrong:0,weak:false}])):{};const seedData=JSON.stringify({person:'Aga',people:{Aga:{stars:old?300:0,world:old?0:world,complete,facts,runs:old?[{name:'Stara misja',at:new Date().toISOString(),first:3,total:3,earned:300}]:[],active:null}}});frame.onload=()=>{frame.onload=null;localStorage.setItem(key,seedData);frame.src='../?qa=1&test='+Date.now()};frame.src='about:blank';document.getElementById('status').textContent=old?'Załadowano zapis w starym formacie.':'Załadowano osobny profil QA dla wybranej krainy.'}document.getElementById('fresh').onclick=()=>seed(false);document.getElementById('old').onclick=()=>seed(true);document.getElementById('reload').onclick=()=>{frame.src=frame.src.split('&reload=')[0]+'&reload='+Date.now()};</script></html>
